<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Studio Stage Background -->
  <rect width="400" height="320" fill="#f1f5f9" />
  
  <!-- Subtle circular stage highlight -->
  <ellipse cx="200" cy="270" rx="140" ry="25" fill="#e2e8f0" />
  <circle cx="200" cy="140" r="110" fill="#ffffff" fill-opacity="0.6" filter="blur(20px)" />

  <!-- Packaging Graphic Shape based on type -->
  
        <!-- Rice Sack -->
        <path d="M 125 70 Q 200 60 275 70 L 270 255 Q 200 265 130 255 Z" fill="url(#bgGrad)" filter="url(#shadow)" />
        <!-- Top Stitching -->
        <path d="M 120 70 L 280 70" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" />
        <rect x="140" y="105" width="120" height="125" rx="14" fill="#ffffff" fill-opacity="0.15" />
      

  <!-- Brand Label Ribbon / Badge -->
  <g transform="translate(200, 48)">
          <rect x="-70" y="-12" width="140" height="24" rx="12" fill="#fbbf24" filter="url(#shadow)" />
          <text x="0" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="#0f172a" letter-spacing="1">PREMIUM RICE</text>
        </g>

  <!-- Brand Typography -->
  <text x="200" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="0.5" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.4))">
    SETRA RAMOS
  </text>

  <!-- Product Name -->
  <text x="200" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#fbbf24" letter-spacing="0.5" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.5))">
    BERAS PREMIUM
  </text>

  <!-- Variant Description -->
  <text x="200" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#ffffff" opacity="0.95">
    Pulen &amp; Bersih
  </text>

  <!-- Net Weight Barcode Footer on Packaging -->
  <g transform="translate(200, 230)">
    <rect x="-60" y="-10" width="120" height="20" rx="6" fill="#000000" fill-opacity="0.35" />
    <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#ffffff">Netto: 5 KG</text>
  </g>
</svg>