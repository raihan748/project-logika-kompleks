<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <!-- Brand Emerald Gradient -->
    <linearGradient id="logoBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="logoGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Glass Highlight Gradient -->
    <linearGradient id="logoGlassGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#044e3f" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- 1. LEFT ICON EMBLEM -->
  <g transform="translate(12, 12)">
    <!-- Base Squircle (96x96) -->
    <rect x="0" y="0" width="96" height="96" rx="26" fill="url(#logoBrandGrad)" filter="url(#logoShadow)" />
    <!-- Glass Gloss Reflection -->
    <path d="M 0 30 C 0 14 14 0 30 0 L 66 0 C 82 0 96 14 96 30 C 96 42 76 52 48 52 C 20 52 0 42 0 30 Z" fill="url(#logoGlassGloss)" />
    <rect x="1" y="1" width="94" height="94" rx="25" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.35" />

    <!-- Mini Storefront Canopy Inside Icon -->
    <g transform="translate(48, 48) scale(0.2)">
      <path d="M 0 -130 L 140 -50 L -140 -50 Z" fill="url(#logoGoldGrad)" />
      
      <!-- Awning Scallops -->
      <path d="M -140 -50 L -100 5 Q -80 20 -60 5 L -100 -50 Z" fill="#ffffff" />
      <path d="M -60 -50 L -20 5 Q 0 20 20 5 L -20 -50 Z" fill="#ffffff" />
      <path d="M 20 -50 L 60 5 Q 80 20 100 5 L 60 -50 Z" fill="#ffffff" />
      
      <path d="M -100 -50 L -60 5 Q -40 20 -20 5 L -60 -50 Z" fill="url(#logoGoldGrad)" />
      <path d="M -20 -50 L 20 5 Q 40 20 60 5 L 20 -50 Z" fill="url(#logoGoldGrad)" />
      <path d="M 60 -50 L 100 5 Q 120 20 140 5 L 100 -50 Z" fill="url(#logoGoldGrad)" />

      <!-- POS Base & Terminal -->
      <rect x="-120" y="20" width="240" height="150" rx="24" fill="#ffffff" />
      <rect x="-105" y="35" width="210" height="85" rx="16" fill="#0f172a" />
      
      <!-- Barcode in screen -->
      <g transform="translate(-80, 55)">
        <rect x="0" y="0" width="6" height="45" fill="#10b981" />
        <rect x="12" y="0" width="14" height="45" fill="#10b981" />
        <rect x="32" y="0" width="6" height="45" fill="#10b981" />
        <rect x="44" y="0" width="18" height="45" fill="#10b981" />
        <rect x="68" y="0" width="8" height="45" fill="#10b981" />
      </g>
      
      <!-- Checkmark Indicator -->
      <circle cx="65" cy="77" r="20" fill="url(#logoGoldGrad)" />
      <path d="M 56 77 L 62 83 L 74 71" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Drawer Slot -->
      <rect x="-75" y="135" width="150" height="15" rx="7" fill="#cbd5e1" />
    </g>
  </g>

  <!-- 2. BRAND TYPOGRAPHY -->
  <g transform="translate(128, 62)">
    <!-- "Warung" -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#0f172a" letter-spacing="-1">
      Warung
    </text>

    <!-- "Pro" in Brand Emerald -->
    <text x="168" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#059669" letter-spacing="-1">
      Pro
    </text>

    <!-- "POS" Modern Pill Badge -->
    <g transform="translate(254, -36)">
      <rect x="0" y="0" width="76" height="42" rx="14" fill="url(#logoBrandGrad)" />
      <rect x="1" y="1" width="74" height="40" rx="13" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4" />
      <text x="38" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="1.5">
        POS
      </text>
    </g>
  </g>

  <!-- 3. BRAND TAGLINE -->
  <g transform="translate(130, 88)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#64748b" letter-spacing="2" text-transform="uppercase">
      SMART CLOUD POINT OF SALE
    </text>
    <circle cx="270" cy="-4" r="3" fill="#10b981" />
    <text x="282" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#059669" letter-spacing="1.5">
      GLOBAL EDITION
    </text>
  </g>
</svg>
